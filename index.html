<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BudgetPlanner</title>
  <meta name="description" content="Monthly budget, goals and first-home planning for salaried employees in Greece.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- Apply a saved theme before first paint to avoid a flash -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem("budgetplanner:v1") || "null");
      var th = s && s.settings && s.settings.theme;
      if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th);
      if (localStorage.getItem("bp-nav-collapsed") === "1") document.documentElement.classList.add("nav-collapsed");
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/content.css">
</head>
<body>
  <a class="skip-link" href="#main" id="skip-link">Skip to main content</a>
  <div id="banner" role="status"></div>
  <div class="layout">
    <header class="site-header" id="site-header"></header>
    <div class="content">
      <div class="topbar" aria-hidden="true"></div>
      <main id="main" tabindex="-1">
        <noscript><p>BudgetPlanner needs JavaScript to run. Please turn it on in your browser.</p></noscript>
      </main>
    </div>
  </div>
  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
